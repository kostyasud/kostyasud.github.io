<style>
  :root {
    --navy: #283c64;
    --navy-2: #234173;
    --blue: #5582d7;
    --white: #fff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 400 16px/1.5 Montserrat, "Century Gothic", sans-serif; color: var(--navy); background: var(--white); }
  a { color: inherit; text-decoration: none; }
  button, input, select { font: inherit; color: inherit; }
  header { background: var(--navy); color: var(--white); }
  .wrap { width: min(1100px, calc(100% - 40px)); margin: 0 auto; }
  .top, .bar, .foot { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; padding: 12px 0; }
  .top, .bar { justify-content: space-between; }
  .top { font-size: 14px; border-bottom: 1px solid rgba(255,255,255,.25); }
  .top a { color: var(--white); }
  .top-side { display: flex; gap: 16px; align-items: center; margin-left: auto; }
  .icon { display: inline-flex; width: 20px; height: 20px; }
  .icon svg { display: block; width: 20px; height: 20px; }
  .logo { font-weight: 700; letter-spacing: .08em; margin-right: auto; }
  nav.main { display: flex; gap: 4px 18px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
  .menu { position: relative; }
  .menu > a { display: inline-block; padding: 8px 0; }
  nav.main a[aria-current="page"] { text-decoration: underline; text-underline-offset: 4px; }
  .drop { display: none; position: absolute; top: 100%; right: 0; min-width: 260px; background: var(--white); color: var(--navy); border: 1px solid var(--blue); padding: 8px; z-index: 5; }
  .menu:hover .drop, .menu:focus-within .drop, .menu.open .drop { display: block; }
  .drop a { display: block; padding: 6px 8px; }
  .drop a:hover { background: #eef3fb; }
  .drop .col-title { padding: 8px 8px 2px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); }
  .drop.wide { display: none; min-width: 460px; grid-template-columns: 1fr 1fr; gap: 8px; }
  .menu:hover .drop.wide, .menu:focus-within .drop.wide, .menu.open .drop.wide { display: grid; }
  main { padding: 28px 0 48px; }
  .layout { display: grid; grid-template-columns: 230px 1fr; gap: 28px; align-items: start; }
  .struct { border: 1px solid var(--blue); padding: 8px; position: sticky; top: 12px; }
  .struct a { display: block; padding: 7px 8px; }
  .struct a[aria-current="page"] { background: var(--navy); color: var(--white); }
  h1, h2 { font-weight: 700; margin: 0 0 16px; }
  h1 { font-size: 32px; }
  h2 { font-size: 26px; }
  .domain { margin: 0 0 8px; color: var(--blue); font-size: 13px; }
  .block { border: 1px solid var(--blue); padding: 20px; margin: 0 0 20px; }
  .block h3 { margin: 0 0 12px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); }
  .block p { margin: 0 0 8px; }
  .block p:last-child { margin: 0; }
  .slider { border: 1px solid var(--blue); min-height: 220px; margin: 0 0 20px; padding: 24px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; background: #eef3fb; }
  .slider-kicker { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); }
  .slider-title { margin: 0; font-size: 32px; font-weight: 700; line-height: 1.15; }
  .slider p { margin: 0; max-width: 520px; }
  .slider-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
  .slider-actions .btn-white { background: var(--white); color: var(--navy); }
  .nonprofit { border: 1px solid var(--blue); background: #eef3fb; padding: 16px 20px; margin: 0 0 20px; }
  .nonprofit b { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); }
  .nonprofit p { margin: 0; }
  .actions, .cards, .people { display: grid; gap: 12px; }
  .actions { grid-template-columns: repeat(3, 1fr); }
  .actions a, .cards article, .people article { border: 1px solid var(--blue); padding: 16px; display: block; }
  .cards { grid-template-columns: repeat(3, 1fr); }
  .people { grid-template-columns: 1fr 1fr; }
  .photo { width: 72px; height: 72px; border: 1px solid var(--blue); display: grid; place-items: center; font-size: 12px; color: var(--blue); margin-bottom: 8px; }
  .portrait { width: 96px; height: 120px; object-fit: cover; object-position: top; display: block; margin-bottom: 8px; border: 1px solid var(--blue); }
  .gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .gallery img, .scheme { width: 100%; display: block; }
  .review-shot, .park-shot { width: min(280px, 100%); height: auto; display: block; }
  .gallery img { height: 140px; object-fit: cover; }
  .nav-toggle { display: none; background: transparent; color: var(--white); border-color: rgba(255,255,255,.7); }
  .cards img { width: 100%; height: 160px; object-fit: cover; background: #eef3fb; display: block; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid var(--blue); padding: 8px; text-align: left; vertical-align: top; }
  th { font-weight: 700; }
  form { display: grid; gap: 8px; max-width: 460px; }
  input, select { border: 1px solid var(--navy); padding: 8px; background: var(--white); }
  button, .btn { border: 1px solid var(--navy); background: var(--navy); color: var(--white); padding: 10px 14px; cursor: pointer; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tabs button { background: var(--white); color: var(--navy); }
  .links { display: grid; gap: 8px; }
  .links a { border: 1px solid var(--blue); padding: 12px 16px; }
  footer { background: var(--navy); color: #fff; margin-top: 48px; }
  .foot { display: block; padding: 40px 0 28px; }
  .foot-top { display: grid; grid-template-columns: minmax(200px, 260px) minmax(220px, 1fr) minmax(240px, 320px); gap: 28px 40px; align-items: start; }
  .foot h2 { margin: 0 0 16px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); }
  .contacts p, .contacts > a { margin: 0; display: block; padding: 3px 0; color: #fff; }
  .contacts .place { margin-bottom: 8px; }
  .messengers { display: flex; gap: 12px; margin-top: 14px; }
  .messengers a { color: #fff; }
  .docs a, .doc-board a { display: block; padding: 3px 0; }
  .docs .all-docs { margin-top: 12px; color: #fff; text-decoration: underline; text-underline-offset: 3px; }
  .doc-board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .foot .group b { display: block; margin-bottom: 8px; }
  .docs a { display: block; padding: 3px 0; color: #fff; font-size: 14px; line-height: 1.35; }
  .docs a:hover, .contacts a:hover { color: var(--blue); }
  .foot-legal { margin: 0; padding: 0; border: 0; max-width: none; font-size: 14px; line-height: 1.4; }
  .foot-legal a { display: block; margin-top: 12px; color: #fff; }
  .foot-legal a:hover { color: var(--blue); }
  .foot-legal p { margin: 0; }
  .foot-legal b { display: block; margin-bottom: 4px; }
  .toast { position: fixed; right: 16px; bottom: 16px; background: var(--white); color: var(--navy); border: 1px solid var(--navy); padding: 12px 14px; }
  @media (max-width: 800px) {
    .layout, .actions, .cards, .people, .drop.wide { grid-template-columns: 1fr; }
    .foot-top, .foot-legal, .doc-board, .gallery { grid-template-columns: 1fr; }
    .nav-toggle { display: inline-block; }
    nav.main { display: none; flex-basis: 100%; flex-direction: column; align-items: flex-start; }
    nav.main.open { display: flex; }
    .drop, .drop.wide { position: static; min-width: 0; width: 100%; }
    .menu:hover .drop, .menu:focus-within .drop, .menu:hover .drop.wide, .menu:focus-within .drop.wide { display: none; }
    .menu.open .drop { display: block; }
    .menu.open .drop.wide { display: grid; }
    .struct { position: static; }
  }
</style>

function path() {
  const raw = location.hash.replace(/^#/, "") || "/";
  const clean = raw.startsWith("/") ? raw : "/" + raw;
  return ALIAS[clean] || clean;
}
function linkHref(href) {
  return href.startsWith("http") ? href : "#" + href;
}
function block(title, html) {
  return `<section class="block"><h3>${title}</h3>${html || ""}</section>`;
}
function table(headers, rows) {
  return `<table><thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function form(title, fields) {
  const fieldsHtml = fields.map(name => `<input required placeholder="${name}" aria-label="${name}">`).join("");
  return block(title, `<form data-form>${fieldsHtml}<button type="submit">Отправить</button></form>`);
}
function frame(sideId, domain, html) {
  const [title, links] = SIDE[sideId];
  const here = path();
  const nav = links.map(([name, href]) => `<a href="${linkHref(href)}"${here === href ? ' aria-current="page"' : ""}>${name}</a>`).join("");
  return `<div class="layout"><nav class="struct" aria-label="${title}">${nav}</nav><div><p class="domain">${domain}</p>${html}</div></div>`;
}
function person(name, role, lines, photo) {
  const pic = photo ? `<img class="portrait" alt="${name}" src="${photo}">` : `<div class="photo">Фото</div>`;
  return `<article>${pic}<b>${name}</b><p>${role}</p>${lines.map(line => `<p>${line}</p>`).join("")}</article>`;
}
function gallery(urls) {
  return `<div class="gallery">${urls.map(src => `<img alt="" src="${src}">`).join("")}</div>`;
}

function renderNav() {
  const here = path();
  document.getElementById("nav").innerHTML = NAV.map(item => {
    const on = item.match.some(prefix => here === prefix || here.startsWith(prefix + "/")) ? ' aria-current="page"' : "";
    let drop = "";
    if (item.columns) {
      drop = `<div class="drop wide">${item.columns.map(([title, links]) => `<div><div class="col-title">${title}</div>${links.map(([name, href]) => `<a href="${linkHref(href)}">${name}</a>`).join("")}</div>`).join("")}</div>`;
    } else {
      drop = `<div class="drop">${item.links.map(([name, href]) => `<a href="${linkHref(href)}">${name}</a>`).join("")}</div>`;
    }
    return `<div class="menu"><a href="#${item.href}"${on}>${item.title}</a>${drop}</div>`;
  }).join("");
}

function renderPrices() {
  const panel = document.getElementById("price-panel");
  if (!panel) return;
  const show = name => { panel.innerHTML = prices[name](); };
  show("ind");
  panel.parentElement.addEventListener("click", event => {
    const button = event.target.closest("button[data-tab]");
    if (button) show(button.dataset.tab);
  });
}

function renderBook() {
  const hall = document.getElementById("hall");
  const part = document.getElementById("part");
  const out = document.getElementById("book-price");
  if (!hall || !out) return;
  const draw = () => { out.textContent = rub(hallPrice[hall.value][Number(part.value)]) + " в час"; };
  hall.addEventListener("change", draw);
  part.addEventListener("change", draw);
  draw();
}

function legalKey(here) {
  if (here.startsWith("/klub")) return "club";
  if (here.startsWith("/vyezdy")) return "trips";
  if (here.startsWith("/magazin") || here.startsWith("/associaciya")) return "";
  return "school";
}
function renderFootLegal() {
  const box = document.getElementById("foot-legal");
  if (!box) return;
  const item = LEGAL.find(row => row[0] === legalKey(path()));
  const body = item ? `<div><b>${item[1]}</b><p>${item[2]}</p></div>` : "";
  const all = path() === "/dokumenty" ? "" : `<a href="#/dokumenty">Все реквизиты</a>`;
  box.innerHTML = `<h2>Реквизиты</h2>${body}${all}`;
}

function renderFootDocs() {
  const box = document.getElementById("foot-docs");
  if (!box) return;
  const group = DOC_GROUPS.find(item => item[0] === docKey(path()));
  const all = path() === "/dokumenty" ? "" : `<a class="all-docs" href="#/dokumenty">Все документы</a>`;
  box.innerHTML = mainDocs(group) + all;
}

function render() {
  if (path() === "/mabplay") {
    location.replace("https://mabplay.ru/");
    return;
  }
  const view = pages[path()] || (() => `<h2>Страница не найдена</h2><p><a href="#/">На главную</a></p>`);
  document.getElementById("app").innerHTML = view();
  renderFootDocs();
  renderFootLegal();
  renderPrices();
  renderBook();
  document.querySelectorAll("form[data-form]").forEach(node => {
    node.addEventListener("submit", event => {
      event.preventDefault();
      document.querySelectorAll(".toast").forEach(item => item.remove());
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = "Заявка принята";
      document.body.appendChild(toast);
    });
  });
  renderNav();
  window.scrollTo(0, 0);
}
document.getElementById("nav-toggle").addEventListener("click", () => {
  const nav = document.getElementById("nav");
  const open = nav.classList.toggle("open");
  document.getElementById("nav-toggle").setAttribute("aria-expanded", String(open));
});
document.getElementById("nav").addEventListener("click", event => {
  const link = event.target.closest(".menu > a");
  if (!link || !window.matchMedia("(max-width: 800px)").matches) return;
  const menu = link.parentElement;
  if (!menu.querySelector(".drop")) return;
  if (!menu.classList.contains("open")) {
    event.preventDefault();
    document.querySelectorAll(".menu.open").forEach(node => node.classList.remove("open"));
    menu.classList.add("open");
  }
});
window.addEventListener("hashchange", render);
if (!location.hash) location.hash = "#/";
render();
</script>
</body>
</html>
